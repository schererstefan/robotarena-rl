# League v2 (Experiment 1, Sep 2026): permanent scripted floor + PFSP +
# KL anchor to the iteration seed + live rollback gate.
#
# What changed vs ppo_continue_hard_selfplay.yaml:
#  - p_scripted 0.70 PERMANENT floor: the scripted anchor was
#    load-bearing (pure self-play collapsed 0.82 -> 0.37 aggregate). It
#    never decays to 0 in this config.
#  - p_latest is now a fraction OF THE SELF-PLAY SHARE (rl/league.py was
#    fixed: the old absolute-threshold code drew the newest snapshot on
#    every self-play roll with 0.7/0.5, never touching the history pool).
#  - PFSP: scripted bots are weighted by difficulty from the live policy's
#    latest deterministic roster eval (weight ~ (1-win_rate)^1.5, 20%
#    uniform floor), so the blockers (ghost, brawler) get the most reps.
#  - anchor: soft KL penalty toward the frozen iteration seed (the global
#    best), coef 0.05 annealed linearly to 0 over the run. Resists
#    catastrophic forgetting of fixed-bot skills without capping
#    exploration late.
#  - rollback: halt the run if min-of-six drops >5pp below the iteration
#    reference on 2 consecutive evals. The campaign reseeds every iteration
#    from the global best, so a halted run rolls back structurally.
#  - run-best checkpoint selection is by MIN-OF-SIX (was aggregate), matching
#    the campaign's scoring metric.
run_name: ppo_league_v2
seed: 13

env:
  n_envs: 8
  arena: open
  loadout: { overdrive: 2, trigger: 2, plating: 2 }
  reward_weights:
    dealt: 2.0
    taken: -1.0
    aim: 0.003
    fireLead: 0.03
    dodge: 0.005
    win: 10.0
    loss: -10.0

league:
  scripted: [rusher, rusher, hunter, wanderer, ghost, ghost, hunter-hc2, brawler, brawler]
  p_scripted: 0.70
  p_latest: 0.5
  max_snapshots: 8
  min_roster_rate: 0.55
  pfsp_exponent: 1.5
  uniform_mix: 0.2

anchor:
  enabled: true
  kl_coef: 0.05
  anneal: true

rollback:
  enabled: true
  max_drop: 0.05
  patience: 2

ppo:
  n_steps: 2048
  n_epochs: 10
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_schedule: linear
  gamma: 0.999
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  ortho_init: true

training:
  total_timesteps: 8000000
  checkpoint_freq: 25
  snapshot_freq: 10
  eval_freq: 10
  eval_bots: [wanderer, rusher, hunter, ghost, hunter-hc2, brawler]
  eval_episodes: 10
