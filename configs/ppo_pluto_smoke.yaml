# Pluto upgrade smoke run: frame-stacked obs (516-dim) + strategy conditioning,
# scaled MLP (~2.1M params), diversity + opening rewards. Short run to validate
# the new architecture learns before the full campaign.
run_name: ppo_pluto_smoke
seed: 7

env:
  n_envs: 8
  arena: open
  loadout: { overdrive: 2, trigger: 2, plating: 2 }
  reward_weights:
    dealt: 2.0
    taken: -1.0
    aim: 0.003
    fireLead: 0.03
    dodge: 0.005
    diversity: 0.05
    opening: 0.002
    win: 10.0
    loss: -10.0

league:
  scripted: [wanderer, rusher]
  p_scripted: 1.0
  p_latest: 0.0
  max_snapshots: 8

ppo:
  n_steps: 2048
  n_epochs: 10
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_schedule: linear
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [1024, 1024, 512]
  ortho_init: true

training:
  total_timesteps: 1500000
  checkpoint_freq: 25
  snapshot_freq: 10
  eval_freq: 10
  eval_bots: [wanderer, rusher, hunter, ghost, hunter-hc2, brawler]
  eval_episodes: 10
