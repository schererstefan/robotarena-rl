# Continue-hard stage, SELF-PLAY BLEND (mid-campaign switch at iteration 8,
# Sep 22, 2026, per Stefan): the live campaign loop was launched before the
# validated-self-play code existed and cannot pick up scripts/campaign.sh
# edits mid-run, so this file -- the config the running loop actually reads
# each iteration -- carries the blend directly.
# 70% scripted (rusher 2x, hunter, wanderer, ghost, hunter-hc2) /
# 30% validated league self-play. A snapshot is admitted to the league pool
# only after a deterministic 6-bot roster eval shows a new run-best
# aggregate >= min_roster_rate (see SnapshotCallback in rl/train.py).
# p_latest biases self-play toward the strongest admitted snapshot.
# Dodge shaping stays on (0.005).
run_name: ppo_continue_hard
seed: 13

env:
  n_envs: 8
  arena: open
  loadout: { overdrive: 2, trigger: 2, plating: 2 }
  reward_weights:
    dealt: 2.0
    taken: -1.0
    aim: 0.003
    fireLead: 0.03
    dodge: 0.005
    win: 10.0
    loss: -10.0

league:
  scripted: [rusher, rusher, hunter, wanderer, ghost, hunter-hc2]
  p_scripted: 0.7
  p_latest: 0.5
  max_snapshots: 8
  min_roster_rate: 0.55

ppo:
  n_steps: 2048
  n_epochs: 10
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_schedule: linear
  gamma: 0.999
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  ortho_init: true

training:
  total_timesteps: 8000000
  checkpoint_freq: 25
  snapshot_freq: 10
  eval_freq: 10
  eval_bots: [wanderer, rusher, hunter, ghost, hunter-hc2, brawler]
  eval_episodes: 10
