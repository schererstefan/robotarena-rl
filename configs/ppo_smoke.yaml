# Short verification run: fixed opponent (wanderer), no league snapshots
run_name: ppo_smoke
seed: 1

env:
  n_envs: 8
  arena: open
  loadout: { overdrive: 2, trigger: 2, plating: 2 }

league:
  scripted: [wanderer]
  p_scripted: 1.0
  p_latest: 0.0
  max_snapshots: 8

ppo:
  n_steps: 2048
  n_epochs: 10
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_schedule: linear
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  ortho_init: true

training:
  total_timesteps: 300000
  checkpoint_freq: 25
  snapshot_freq: 10
  eval_freq: 5
  eval_bots: [wanderer]
  eval_episodes: 10
