# PURE SELF-PLAY experiment (Stefan, Sep 23, 2026): 10,000 PPO iterations of
# self-play vs the run's own validated snapshot pool, resumed from the
# broad-gate campaign best. p_scripted=0.0, so every episode draws from the
# league pool; until the first snapshot is admitted the league falls back to
# scripted opponents (see League.sample). Snapshots are admitted only after a
# deterministic 6-bot roster eval shows a new run-best aggregate >=
# min_roster_rate (validated admission) — this is what keeps pure self-play
# from drifting into policies that can't beat the programmatic bots.
# Intermediate evals vs the programmatic bots run every 10 rollouts
# (eval_history.jsonl) — the transfer curve this experiment is measuring.
run_name: ppo_pure_selfplay
seed: 13

env:
  n_envs: 8
  arena: open
  loadout: { overdrive: 2, trigger: 2, plating: 2 }
  reward_weights:
    dealt: 2.0
    taken: -1.0
    aim: 0.003
    fireLead: 0.03
    dodge: 0.005
    win: 10.0
    loss: -10.0

league:
  scripted: [rusher, rusher, hunter, wanderer, ghost, ghost, hunter-hc2, brawler, brawler]
  p_scripted: 0.0
  p_latest: 0.5
  max_snapshots: 8
  min_roster_rate: 0.55

ppo:
  n_steps: 2048
  n_epochs: 10
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_schedule: linear
  gamma: 0.999
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  ortho_init: true

training:
  total_timesteps: 163840000
  checkpoint_freq: 25
  snapshot_freq: 10
  eval_freq: 10
  eval_bots: [wanderer, rusher, hunter, ghost, hunter-hc2, brawler]
  eval_episodes: 10
