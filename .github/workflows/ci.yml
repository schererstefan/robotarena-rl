# Scope is pure tests + dodge guard + compileall only. The dodge guard
# (scripts/dodge_check.py) is pure Python and runs as part of this gate.
# The Node-bridge smoke test (scripts/smoke.sh) is intentionally NOT
# run here because it needs the sibling robotarena checkout and a built
# bridge, unavailable on stock hosted runners.
name: CI

on:
  pull_request:
    branches: [pluto-upgrade, main]
  push:
    branches: [pluto-upgrade]

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch first
        run: |
          python -m pip install --upgrade pip
          # Pre-install CPU-only torch so requirements.txt's torch>=2.4 is
          # satisfied without pulling the multi-GB CUDA wheels from PyPI.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install dependencies
        run: |
          # requirements.txt is currently unpinned lower bounds, so this gate
          # is not fully reproducible until pinning lands (tracked separately
          # in draft PR #1 — do not pin here).
          pip install -r requirements.txt pytest
      # Signal-only at first: continue-on-error so a newly disclosed CVE
      # does not red the gate; Dependabot will surface it as a PR.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true
      - name: Run pure tests
        run: pytest tests/ -q
      - name: Run dodge check
        run: python scripts/dodge_check.py
      - name: Compile check
        run: python -m compileall rl scripts
