# Scope is pure tests + compileall only. The Node-bridge smoke test
# (scripts/smoke.sh) is intentionally NOT run here because it needs the
# sibling robotarena checkout and a built bridge, unavailable on stock
# hosted runners.
name: CI

on:
  pull_request:
    branches: [pluto-upgrade, main]
  push:
    branches: [pluto-upgrade]

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch first
        run: |
          python -m pip install --upgrade pip
          # Pre-install CPU-only torch so requirements.txt's torch>=2.4 is
          # satisfied without pulling the multi-GB CUDA wheels from PyPI.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install dependencies
        run: |
          # requirements.txt is currently unpinned lower bounds, so this gate
          # is not fully reproducible until pinning lands (tracked separately
          # in draft PR #1 — do not pin here).
          pip install -r requirements.txt pytest
      - name: Run pure tests
        run: pytest tests/ -q
      - name: Compile check
        run: python -m compileall rl scripts
